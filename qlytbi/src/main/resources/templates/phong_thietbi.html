<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Danh sách thiết bị trong phòng ' + ${phong.tenPhong}"></title>
</head>
<body>
    <div th:fragment="content">
        <h2 class="mb-4" th:text="'Danh sách thiết bị trong phòng ' + ${phong.tenPhong} + ' (' + ${phong.loaiPhong.tenLoai} + ')'"></h2>
        
        <!-- Thông báo thành công -->
        <div th:if="${param.success}" class="alert alert-success" role="alert">
            <span th:switch="${param.success}">
                <span th:case="'Da luu thiet bi thanh cong'">Đã lưu thiết bị thành công</span>
                <span th:case="'Da xoa thiet bi thanh cong'">Đã xóa thiết bị thành công</span>
                <span th:case="*"><span th:text="${param.success}"></span></span>
            </span>
        </div>
        <!-- Thông báo lỗi -->
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <span th:switch="${param.error}">
                <span th:case="'Thiet bi khong ton tai'">Thiết bị không tồn tại</span>
                <span th:case="'Phong khong ton tai'">Phòng không tồn tại</span>
                <span th:case="'Loi khi xoa thiet bi'">Lỗi khi xóa thiết bị</span>
                <span th:case="*"><span th:text="${param.error}"></span></span>
            </span>
        </div>
        
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên thiết bị</th>
                    <th>Mã thiết bị</th>
                    <th>Số lượng</th>
                    <th>Tình trạng</th>
                    <th>Ngày lắp đặt</th>
                    <th>Mô tả</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tb : ${thietbis}">
                    <td th:text="${tb.idThietBi}"></td>
                    <td th:text="${tb.tenThietBi}"></td>
                    <td th:text="${tb.maThietBi}"></td>
                    <td th:text="${tb.soLuong}"></td>
                    <td th:text="${tb.tinhTrang}"></td>
                    <td th:text="${#dates.format(tb.ngayLapDat, 'dd/MM/yyyy')}"></td>
                    <td th:text="${tb.moTa}"></td>
                    <td>
                        <a th:href="@{/thietbi/edit/{id}(id=${tb.idThietBi})}" 
                           class="btn btn-sm btn-warning">Sửa</a>
                        <form th:action="@{/thietbi/delete/{id}(id=${tb.idThietBi})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger" 
                                    onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${thietbis.isEmpty()}">
                    <td colspan="8" class="text-center">Không có thiết bị trong phòng này</td>
                </tr>
            </tbody>
        </table>
        <a th:href="@{/thietbi}" class="btn btn-secondary">Quay lại danh sách thiết bị</a>
    </div>
</body>
</html>
