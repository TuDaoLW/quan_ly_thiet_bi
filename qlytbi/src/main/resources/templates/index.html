<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Danh sách thiết bị'"></title>
</head>
<body>
    <div th:fragment="content">
        <h2 class="mb-4">Danh Sách Thiết Bị</h2>
        
        <!-- Form tìm kiếm -->
        <form th:action="@{/thietbi}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" name="keyword" class="form-control" 
                       th:value="${keyword}" placeholder="Tìm kiếm thiết bị...">
                <button type="submit" class="btn btn-primary">Tìm</button>
            </div>
        </form>

        <!-- Bảng thiết bị -->
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên thiết bị</th>
                    <th>Mã thiết bị</th>
                    <th>Phòng học</th>
                    <th>Số lượng</th>
                    <th>Tình trạng</th>
                    <th>Ngày lắp đặt</th>
                    <th>Mô tả</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tb : ${thietbis}">
                    <td th:text="${tb.idThietBi}"></td>
                    <td th:text="${tb.tenThietBi}"></td>
                    <td th:text="${tb.maThietBi}"></td>
                    <td th:text="${tb.phongHoc.tenPhong}"></td>
                    <td th:text="${tb.soLuong}"></td>
                    <td th:text="${tb.tinhTrang}"></td>
                    <td th:text="${#dates.format(tb.ngayLapDat, 'dd/MM/yyyy')}"></td>
                    <td th:text="${tb.moTa}"></td>
                    <td>
                        <a th:href="@{/thietbi/edit/{id}(id=${tb.idThietBi})}" 
                           class="btn btn-sm btn-warning">Sửa</a>
                        <a th:href="@{/thietbi/delete/{id}(id=${tb.idThietBi})}" 
                           class="btn btn-sm btn-danger" 
                           onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${thietbis.isEmpty()}">
                    <td colspan="9" class="text-center">Không có dữ liệu</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
