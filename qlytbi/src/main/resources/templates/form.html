<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${thietbi.idThietBi} ? 'Sửa thiết bị' : 'Thêm thiết bị'"></title>
</head>
<body>
    <div th:fragment="content">
        <h2 class="mb-4" th:text="${thietbi.idThietBi} ? 'Sửa thiết bị' : 'Thêm thiết bị'"></h2>
        <form th:action="@{/thietbi/save}" th:object="${thietbi}" method="post">
            <input type="hidden" th:field="*{idThietBi}">
            <div class="mb-3">
                <label for="tenThietBi" class="form-label">Tên thiết bị</label>
                <input type="text" th:field="*{tenThietBi}" class="form-control" id="tenThietBi" required>
            </div>
            <div class="mb-3">
                <label for="maThietBi" class="form-label">Mã thiết bị</label>
                <input type="text" th:field="*{maThietBi}" class="form-control" id="maThietBi" required>
            </div>
            <div class="mb-3">
                <label for="phongHoc" class="form-label">Phòng học</label>
                <select th:field="*{phongHoc}" class="form-select" id="phongHoc" required>
                    <option value="">Chọn phòng</option>
                    <option th:each="phong : ${phongs}" 
                            th:value="${phong.idPhong}" 
                            th:text="${phong.tenPhong}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="soLuong" class="form-label">Số lượng</label>
                <input type="number" th:field="*{soLuong}" class="form-control" id="soLuong" required>
            </div>
            <div class="mb-3">
                <label for="tinhTrang" class="form-label">Tình trạng</label>
                <input type="text" th:field="*{tinhTrang}" class="form-control" id="tinhTrang">
            </div>
            <div class="mb-3">
                <label for="ngayLapDat" class="form-label">Ngày lắp đặt</label>
                <input type="date" th:field="*{ngayLapDat}" class="form-control" id="ngayLapDat">
            </div>
            <div class="mb-3">
                <label for="moTa" class="form-label">Mô tả</label>
                <textarea th:field="*{moTa}" class="form-control" id="moTa" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a th:href="@{/thietbi}" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</body>
</html>
