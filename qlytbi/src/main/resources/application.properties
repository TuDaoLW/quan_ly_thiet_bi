spring.application.name=qlytbi

#spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_phong_hoc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quan_ly_phong_hoc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:tudao}
spring.datasource.password=${DB_PASSWORD:elcom@dtu}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed
spring.thymeleaf.cache=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.port=8080
